name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Bundle Maruko Gothic font and its OFL license
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/max32002/maruko-gothic/main/CJK%20TC/MarukoGothicCJKtc-Regular.ttf' \
            -o app/src/main/assets/maruko_regular.ttf
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/max32002/maruko-gothic/main/SIL_Open_Font_License_1.1.txt' \
            -o app/src/main/assets/OFL.txt
          test -s app/src/main/assets/maruko_regular.ttf
          test -s app/src/main/assets/OFL.txt
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: analog-clock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
